<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--accent);letter-spacing:-.01em;min-width:0}
.brand::before{content:"";flex:none;width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#8b5cf6,#6d28d9)}
header .brand{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubtn{flex:none;display:flex;flex-direction:column;justify-content:center;gap:4px;width:42px;height:40px;padding:0 11px;border:0;border-radius:10px;background:var(--accent-soft)}
.menubtn span{display:block;height:2px;background:var(--accent);border-radius:2px}
.menubtn:hover{background:var(--track)}
.sync{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--good)}.sync.syncing .dot{background:var(--warn)}.sync.error .dot{background:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(30,16,60,.35);z-index:20}

.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.drawer-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:12px 8px 4px}
.drawer button.item{text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink)}
.drawer button.item:hover{background:var(--tint)}
.drawer button.item.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 1px 3px rgba(76,29,149,.06)}
h2{font-size:18px;margin:8px 0 0}h3{font-size:16px;margin:0}h4{font-size:14px;margin:4px 0 0;color:var(--accent)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent-mid)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
button.sm{padding:6px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--accent);padding:2px;text-decoration:underline}
button.x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
button.x:hover{color:var(--bad)}
button.icon{padding:8px 14px;font-size:18px;line-height:1;color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.inline{display:flex;gap:8px}.inline input{flex:1}
.datebar{display:flex;gap:8px;align-items:center}.datebar input{flex:1}
.subtabs,.seg{display:flex;gap:4px;background:var(--track);padding:4px;border-radius:12px;overflow-x:auto}
.subtabs button,.seg button{flex:1;border:0;background:none;padding:8px 10px;white-space:nowrap;color:var(--muted)}
.subtabs button.on,.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(76,29,149,.15)}
.num{font-variant-numeric:tabular-nums}.xl{font-size:30px;font-weight:800;color:var(--accent)}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:12.5px}.good{color:var(--good)}.bad{color:var(--bad)}
p{margin:0}
.meter .mrow{display:flex;justify-content:space-between;font-size:13px}
.track{height:8px;background:var(--track);border-radius:4px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--accent);border-radius:4px}.fill.over{background:var(--bad)}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
ul.rows li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);vertical-align:1px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--track);color:var(--accent)}.pill.good{background:var(--good-soft);color:var(--good)}
.ingrows{display:flex;flex-direction:column;gap:10px}
.ingrow{display:grid;grid-template-columns:minmax(0,2fr) 80px 130px 32px;gap:6px;align-items:center}
@media (max-width:560px){.ingrow{grid-template-columns:1fr 1fr 32px}.ingrow .ingsel{grid-column:1/-1}}
.totals{background:var(--accent-soft);border-radius:10px;padding:10px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.actions{display:flex;gap:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
table.ex td{padding:4px}table.ex input{width:70px;padding:6px}table.ex select{min-width:170px;padding:6px}table.ex select.n{min-width:60px}
.bars{display:flex;flex-direction:column}
.barsarea{position:relative;height:90px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;border-bottom:1px solid var(--line)}
.barsarea i{display:block;justify-self:center;width:100%;max-width:28px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.barsarea i.low{background:var(--accent-mid)}
.tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted)}
.barlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats3 div{display:flex;flex-direction:column}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chartwrap svg{width:100%;height:auto;display:block}
.chartwrap text{fill:var(--muted);font-size:11px}
.gl{stroke:var(--line)}
.s-target{stroke:var(--muted);stroke-dasharray:6 5;fill:none;stroke-width:2}
.s-actual{stroke:var(--accent);fill:none;stroke-width:2.5}
.pt{fill:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:16px;border-top:2.5px solid var(--accent);margin-right:6px;vertical-align:3px}

.fb .warn{background:var(--warn-soft);border-color:var(--warn)}
.fb .bad{background:var(--bad-soft);border-color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:16px}

ul.plain{margin:0;padding-left:18px}
details summary{cursor:pointer;font-weight:700;color:var(--accent)}
.end{display:flex;align-items:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2e1065;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:30}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast,.drawer{transition:none}}
</style>
</head>

/* ================= Food maths ================= */
function allFoods(){ return FOODS.concat(live(D.customIngs)); }
// Turns a dish into an ingredient. One serving is stored as a 100 g "piece",
// so the per-100 g maths below gives per-serving values.
function dishAsFood(r, depth){
  if (depth > 4) return null; // stops a dish that (indirectly) contains itself
  const c = recipeCalc(r, depth);
  return {id:r.id, name:r.name, cat:'My dishes', kcal:c.per.kcal, p:c.per.p, c:c.per.c, fat:c.per.fat, cup:0, unit:100, unitName:r.serving || 'serving', flags:c.flags, isDish:true};
}
function foodById(id, depth){
  if (id && id.startsWith('r_')) { const r = D.recipes.find(x => x.id === id && !x.deleted); return r ? dishAsFood(r, depth || 0) : null; }
  return FOOD_INDEX.get(id) || D.customIngs.find(x => x.id === id && !x.deleted) || null;
}
function unitsFor(f){ if (f.isDish) return ['unit']; const u = []; if (f.unit) u.push('unit'); if (f.cup) u.push('cup', 'tbsp', 'tsp'); u.push('g'); if (f.cup) u.push('ml'); return u; }
function defaultUnit(f){ if (f.unit) return 'unit'; if (!f.cup) return 'g'; if (f.cat === O) return 'tbsp'; if (f.cat === SP) return 'tsp'; return 'cup'; }
function unitName(f, u){ return {cup:'cup (240 ml)', tbsp:'tbsp (15 ml)', tsp:'tsp (5 ml)', g:'grams', ml:'ml'}[u] || ((f && f.unitName) || 'piece'); }
function unitLabel(f, u){ return u === 'unit' ? ((f && f.unitName) || 'piece') : u; }
function grams(f, qty, u){
  qty = +qty || 0;
  if (u === 'g') return qty;
  if (u === 'ml') return qty * f.cup / 240;
  if (VOL[u]) return qty * VOL[u] * f.cup / 240;
  if (u === 'unit') return qty * f.unit;
  return 0;
}
function nutr(f, g){ const k = g / 100; return {kcal:f.kcal * k, p:f.p * k, c:f.c * k, fat:f.fat * k}; }
function recipeCalc(r, depth){
  depth = depth || 0;
  const t = {kcal:0, p:0, c:0, fat:0, g:0}; let flags = '';
  for (const it of r.items || []) {
    if (r.id && it.food === r.id) continue;
    const f = foodById(it.food, depth + 1); if (!f) continue;
    const g = grams(f, it.qty, it.unit), n = nutr(f, g);
    t.kcal += n.kcal; t.p += n.p; t.c += n.c; t.fat += n.fat; t.g += g;
    for (const ch of f.flags) if (!flags.includes(ch) && !(ch === 'N' && f.id === 'f_salt')) flags += ch;
  }
  const s = Math.max(+r.servings || 1, 0.01);

}
function flagChips(flags){ return (flags || '').split('').map(ch => FLAG_NAMES[ch] ? `<span class="flag">${FLAG_NAMES[ch]}</span>` : '').join(' '); }
function foodOptions(sel, list){

  return Object.keys(groups).map(c => `<optgroup label="${esc(c)}">${groups[c].map(f => `<option value="${f.id}"${f.id === sel ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</optgroup>`).join('');
}

/* ================= Activity maths ================= */
function bwOn(date){ const b = live(D.body).filter(x => x.weight && x.date <= date).sort(byDate).pop(); return b ? +b.weight : +D.settings.startWeight; }
function stepsOn(date){ const s = D.steps.find(x => x.id === 'st_' + date && !x.deleted); return s ? +s.steps : 0; }
function stepsKcal(steps, date){ const km = steps * (D.settings.height * 0.415 / 100) / 1000; return 0.5 * bwOn(date) * km; }
function exWorkKcal(row, bw){
  const e = EX[row.name] || {}; if (e.timed) return 0;
  const reps = (+row.sets || 0) * (+row.reps || 0);
  const perRep = (+row.kg || 0) * (+row.n || 0) * (e.lr || 0) + (e.bf || 0) * bw * (e.br || 0);
  return 9.81 * reps * perRep / 4184 / MUSCLE_EFFICIENCY;
}
function sessionParts(w){
  const bw = bwOn(w.date);
  if (w.type === 'activity') return {base:Math.max(0, w.met - 1) * bw * w.minutes / 60, work:0};
  const met = (EFFORT[w.effort] || EFFORT.moderate).met;
  return {base:(met - 1) * bw * (+w.minutes || 0) / 60, work:(w.exercises || []).reduce((a, r) => a + exWorkKcal(r, bw), 0)};
}
function compliance(w){
  const t = TEMPLATES[w.template]; if (!t || !t.ex.length) return null;
  let need = 0, got = 0;
  for (const [name, sets, reps] of t.ex) {
    need += sets;
    const done = (w.exercises || []).filter(r => r.name === name).reduce((a, r) => a + Math.min(+r.sets || 0, sets) * Math.min(1, (+r.reps || 0) / reps), 0);
    got += Math.min(done, sets);

  return need ? got / need : null;
}
function nextTemplate(){
  const last = live(D.workouts).filter(w => w.type === 'strength' && ['A','B','C'].includes(w.template)).sort(byDate).pop();
  return last ? {A:'B', B:'C', C:'A'}[last.template] : 'A';
}
function draftFromTemplate(key){
  const t = TEMPLATES[key], kg = +D.settings.dumbbell || 0;
  return {id:null, type:'strength', template:key, date:UI.date, minutes:t.minutes, effort:t.effort,
    exercises:t.ex.map(([name, sets, reps]) => { const e = EX[name] || {}; return {name, kg:e.n ? kg : 0, n:e.n || 0, sets, reps}; })};
}
function workoutAdvice(ws){
  const s = D.settings, we = addDays(ws, 6), td = today();
  const done = live(D.workouts).filter(w => w.type === 'strength' && w.date >= ws && w.date <= we).length;
  const left = s.workouts - done;
  if (td > we) return left <= 0 ? `Goal met with ${done} workouts.` : `Finished with ${done} of ${s.workouts} workouts.`;
  if (left <= 0) return `Goal met with ${done} workouts. Extra sessions are a bonus; keep up the walking.`;
  const idx = td < ws ? 0 : (parseYmd(td).getDay() + 6) % 7; // 0 = Monday
  if (idx <= 4) {
    if (left <= 2) return `${done} of ${s.workouts} done. Saturday and Sunday can cover the remaining ${left}. If a weekday frees up, a Short workout gets you ahead.`;
    return `${done} of ${s.workouts} done. Plan Saturday and Sunday, plus one weekday session when work allows. A 20-minute Short workout counts.`;
  }
  if (idx === 5) {
    if (left === 1) return '1 left. Do it today or tomorrow.';
    if (left === 2) return '2 left. One today and one tomorrow.';
    return `${left} left with 2 days to go. Do two, plus a Short one if you feel fresh; don’t cram hard sessions.`;
  }
  return left === 1 ? '1 left, and today is the last day of the week. A Short workout counts.' : `${left} left and today is the last day. Do one session; don’t try to catch up all at once.`;
}

/* ================= Day and week numbers ================= */
function dayTotals(date){
  const t = {kcal:0, p:0, c:0, fat:0, alc:0, water:0, steps:0, burn:0};
  for (const e of live(D.food)) if (e.date === date) { t.kcal += e.kcal; t.p += e.p; t.c += e.c; t.fat += e.fat; }
  for (const a of live(D.alcohol)) if (a.date === date) { t.kcal += a.kcal; t.c += a.carbs; t.alc += a.kcal; }
  for (const w of live(D.water)) if (w.date === date) t.water += w.ml;
  t.steps = stepsOn(date);
  t.burn = stepsKcal(t.steps, date) + live(D.workouts).filter(w => w.date === date).reduce((a, w) => a + (w.kcal || 0), 0);
  return t;
}
function targetWeight(date){
  const s = D.settings;
  const days = Math.round((parseYmd(date) - parseYmd(s.startDate)) / 864e5);
  const k = Math.max(0, Math.min(1, days / (s.weeks * 7)));
  return s.startWeight - (s.startWeight - s.goalWeight) * k;
}
function weekStats(ws){
  const we = addDays(ws, 6), inW = r => !r.deleted && r.date >= ws && r.date <= we;
  const sum = (a, k) => a.reduce((x, r) => x + (+r[k] || 0), 0);
  const food = D.food.filter(inW), alc = D.alcohol.filter(inW), water = D.water.filter(inW), wo = D.workouts.filter(inW);
  const steps = D.steps.filter(inW).filter(s => +s.steps > 0);
  const body = D.body.filter(inW).sort(byDate);
  const weighed = body.filter(b => b.weight), waisted = body.filter(b => b.waist);
  const fd = new Set(food.map(e => e.date)).size;
  const byDay = {}; water.forEach(w => byDay[w.date] = (byDay[w.date] || 0) + w.ml);
  const wd = Object.keys(byDay).length;
  const top = {}; food.forEach(e => top[e.name] = (top[e.name] || 0) + e.kcal);
  return {
    ws, we, foodDays:fd,
    avgKcal:fd ? (sum(food, 'kcal') + sum(alc, 'kcal')) / fd : 0, avgP:fd ? sum(food, 'p') / fd : 0,
    avgC:fd ? (sum(food, 'c') + sum(alc, 'carbs')) / fd : 0, avgFat:fd ? sum(food, 'fat') / fd : 0,
    strength:wo.filter(w => w.type === 'strength').length, activities:wo.filter(w => w.type === 'activity').length, workoutKcal:sum(wo, 'kcal'),
    stepDays:steps.length, avgSteps:steps.length ? sum(steps, 'steps') / steps.length : 0,
    stepsKcal:steps.reduce((a, s) => a + stepsKcal(+s.steps, s.date), 0), daysOverMin:steps.filter(s => s.steps >= D.settings.stepsMin).length,
    waterDays:wd, avgWater:wd ? sum(water, 'ml') / wd : 0,
    beerKcal:sum(alc, 'kcal'), drinks:sum(alc, 'drinks'), drinkDays:new Set(alc.map(a => a.date)).size,
    sugar:food.filter(e => (e.flags || '').includes('S')).length, purine:food.filter(e => (e.flags || '').includes('U')).length, salty:food.filter(e => (e.flags || '').includes('N')).length,
    topFoods:Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, k]) => `${n} (${r0(k)} kcal)`),
    weight:weighed.length ? +weighed[weighed.length - 1].weight : null, weightDate:weighed.length ? weighed[weighed.length - 1].date : null,
    waist:waisted.length ? +waisted[waisted.length - 1].waist : null
  };
}
function lastWaistBefore(date){ const b = live(D.body).filter(x => x.waist && x.date < date).sort(byDate).pop(); return b ? +b.waist : null; }
function weekLabel(ws){ const n = Math.round((parseYmd(ws) - parseYmd(weekStart(D.settings.startDate))) / (7 * 864e5)) + 1; return n >= 1 ? `Week ${n}` : 'Before plan'; }
function earliestDate(){ let m = null; COLS.forEach(c => { if (c === 'recipes' || c === 'customIngs') return; live(D[c]).forEach(r => { if (r.date && (!m || r.date < m)) m = r.date; }); }); return m; }
function allWeeks(){
  const e = earliestDate(), s = D.settings.startDate, first = weekStart(e && e < s ? e : s), last = weekStart(today());
  const out = []; for (let w = first; w <= last && out.length < 104; w = addDays(w, 7)) out.push(w);
  return out;
}
function allDays(){ const e = earliestDate(); if (!e) return []; const out = []; for (let d = e; d <= today() && out.length < 730; d = addDays(d, 1)) out.push(d); return out; }
function feedback(st, prev){
  const s = D.settings, out = [], add = (tone, text) => out.push({tone, text});
  if (!st.foodDays) add('warn', 'No food logged this week, so calories and protein can’t be checked.');
  else {
    if (st.foodDays < 5) add('warn', `Food logged on ${st.foodDays} of 7 days. Log every day so the averages mean something.`);
    const d = st.avgKcal - s.kcal;
    if (d > 150) add('bad', `Calories averaged ${r0(st.avgKcal)}, about ${r0(d)} over target. Biggest sources: ${st.topFoods.join(', ')}.`);
    else if (d < -400) add('warn', `Calories averaged ${r0(st.avgKcal)}, well under ${s.kcal}. Eating this little costs muscle; check that everything was logged.`);
    else add('good', `Calories averaged ${r0(st.avgKcal)} against a ${s.kcal} target.`);
    if (st.avgP < s.protein - 15) add('warn', `Protein averaged ${r0(st.avgP)} g, short of ${s.protein} g. An extra egg at breakfast, curd at lunch or a scoop of whey closes most of the gap.`);
    else add('good', `Protein averaged ${r0(st.avgP)} g.`);
  }
  if (st.strength >= s.workouts) add('good', `${st.strength} workouts done (goal ${s.workouts}).`);
  else add(st.strength ? 'warn' : 'bad', `${st.strength} of ${s.workouts} workouts. Weekend sessions plus one Short workout on a weekday is enough.`);
  if (!st.stepDays) add('warn', 'No steps entered. Copy the daily total from the Fitness app.');
  else if (st.avgSteps >= s.stepsMin) add('good', `Steps averaged ${r0(st.avgSteps).toLocaleString('en-IN')}, with ${st.daysOverMin} days at ${s.stepsMin.toLocaleString('en-IN')}+.`);
  else add('warn', `Steps averaged ${r0(st.avgSteps).toLocaleString('en-IN')}. Walking is your biggest calorie burner; aim for at least ${s.stepsMin.toLocaleString('en-IN')}. A 15-minute walk after lunch and dinner covers most of it.`);
  if (st.waterDays && st.avgWater < s.water - 500) add('warn', `Water averaged ${(st.avgWater / 1000).toFixed(1)} L. Aim for ${(s.water / 1000).toFixed(1)} L; it helps your kidneys clear uric acid.`);
  if (st.beerKcal > 0) add(st.drinks > 4 ? 'bad' : 'warn', `Beer added ${r0(st.beerKcal)} kcal over ${st.drinkDays} day${st.drinkDays > 1 ? 's' : ''} (${r1(st.drinks)} standard drinks). Beer raises uric acid and triglycerides, both already borderline in your report.`);
  if (st.purine > 1) add('warn', `High-purine foods (mutton, organ meat, prawns, mackerel) ${st.purine} times. Keep these to once a week.`);
  if (st.sugar > 3) add('warn', `Added-sugar foods ${st.sugar} times. Cutting these helps bring your HbA1c down.`);
  if (st.salty > 4) add('warn', `Salty snacks or pickle ${st.salty} times. Fewer of these helps your blood pressure.`);
  if (st.weight != null) {
    const tgt = targetWeight(st.weightDate), diff = st.weight - tgt;
    if (diff <= 0.3) add('good', `Weight ${st.weight} kg vs target ${r1(tgt)} kg: on track.`);
    else if (diff <= 1) add('warn', `Weight ${st.weight} kg vs target ${r1(tgt)} kg: slightly behind. Tighten logging and portions this week.`);
    else add('bad', `Weight ${st.weight} kg vs target ${r1(tgt)} kg: ${r1(diff)} kg behind. Drop one chapatti a day or add 2,000 steps.`);
    if (prev && prev.weight != null) {
      const drop = prev.weight - st.weight, wk = parseInt(weekLabel(st.ws).replace(/\D/g, '')) || 0;
      if (drop > 1.2 && wk > 2) add('warn', `Lost ${r1(drop)} kg this week. Faster than 1.2 kg a week raises uric acid and costs muscle; add a fruit or a chapatti back.`);
      else if (drop < 0.2 && wk > 2) add('warn', `Weight barely moved since last week (${r1(drop)} kg). One flat week is normal; two in a row means cut about 150 kcal a day.`);
    }
  } else add('warn', 'No weigh-in this week. Weigh yourself on Sunday morning.');
  if (st.waist != null) {
    const pw = lastWaistBefore(st.ws);
    if (pw != null) { const d = pw - st.waist; add(d > 0 ? 'good' : 'warn', d > 0 ? `Waist down ${r1(d)} in since the last measurement.` : `Waist unchanged or up (${st.waist} in). Check it again next Sunday.`); }
  }
  return out;
}

function recentChips(){
  const seen = new Set(), out = [];
  for (const e of live(D.food).sort((a, b) => b.updatedAt - a.updatedAt)) {
    const k = e.kind + '|' + e.ref + '|' + e.qty + '|' + e.unit; if (seen.has(k)) continue;
    seen.add(k); out.push(e); if (out.length >= 8) break;
  }
  if (!out.length) return '';
  return `<div><span class="muted small">Quick add to ${UI.meal}</span><div class="chips">${out.map(e => `<button class="chip" data-action="relog" data-id="${e.id}">${esc(fmtQ(e.qty))} ${esc(e.unitLabel || e.unit)} · ${esc(e.name)}</button>`).join('')}</div></div>`;

function dayNum(d){ return Math.round((parseYmd(d) - parseYmd(D.settings.startDate)) / 864e5); }
function weightChart(){

  const target = []; if (x0 < 0) target.push([x0, +s.startWeight]);
  target.push([0, +s.startWeight], [end, +s.goalWeight]); if (x1 > end) target.push([x1, +s.goalWeight]);

function waistChart(){

function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function chart(series, x0, x1, unit){
  const W = 640, H = 230, L = 40, R = 14, T = 10, B = 26;
  const ys = series.flatMap(s => s.pts.map(p => p[1])); if (!ys.length) return '<p class="empty">No data yet.</p>';
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max(0.5, (y1 - y0) * 0.1);
  y0 = Math.floor(y0 - pad); y1 = Math.ceil(y1 + pad);
  const sx = x => L + (x - x0) / ((x1 - x0) || 1) * (W - L - R), sy = y => T + (y1 - y) / ((y1 - y0) || 1) * (H - T - B);
  const st = niceStep((y1 - y0) / 5); let g = '';
  for (let v = Math.ceil(y0 / st) * st; v <= y1 + 1e-9; v += st) { const y = sy(v); g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${+v.toFixed(1)}</text>`; }
  const every = Math.max(1, Math.ceil((x1 - x0) / 7 / 10));
  for (let k = Math.ceil(x0 / 7); k * 7 <= x1; k += every) g += `<text x="${sx(k * 7).toFixed(1)}" y="${H - 8}" text-anchor="middle">W${k}</text>`;
  let p = '';
  for (const s of series) {
    if (!s.pts.length) continue;
    p += `<polyline class="${s.cls}" points="${s.pts.map(q => sx(q[0]).toFixed(1) + ',' + sy(q[1]).toFixed(1)).join(' ')}"/>`;
    if (s.dots) p += s.pts.map(q => `<circle class="pt" cx="${sx(q[0]).toFixed(1)}" cy="${sy(q[1]).toFixed(1)}" r="4"><title>${q[1]} ${unit}</title></circle>`).join('');
  }
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart in ${unit}">${g}${p}</svg></div>`;
}

/* ================= GitHub sync ================= */
function ghReady(){ return !!(GHCFG.owner && GHCFG.repo && GHCFG.token); }
function ghUrl(){ return `https://api.github.com/repos/${encodeURIComponent(GHCFG.owner)}/${encodeURIComponent(GHCFG.repo)}/contents/${(GHCFG.path || 'data.json').split('/').map(encodeURIComponent).join('/')}`; }
function ghHeaders(){ return {Authorization:'Bearer ' + GHCFG.token, Accept:'application/vnd.github+json'}; }
function ghErr(status){
  if (status === 401) return 'GitHub rejected the token. Paste a new one in Settings.';
  if (status === 403) return 'The token can’t write to this repo. Give it Contents: Read and write.';
  if (status === 404) return 'Repo not found. Check the username and repo name, and that the token can access it.';
  return 'GitHub error ' + status + '.';
}
function b64enc(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64dec(b64){ const bin = atob(b64.replace(/\s/g, '')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
async function ghGet(){
  const r = await fetch(ghUrl() + '?t=' + Date.now(), {headers:ghHeaders(), cache:'no-store'});
  if (r.status === 404) return {sha:null, data:null};
  if (!r.ok) throw new Error(ghErr(r.status));
  const j = await r.json(); let content = j.content;
  if (!content && j.git_url) { const b = await fetch(j.git_url, {headers:ghHeaders(), cache:'no-store'}); if (!b.ok) throw new Error(ghErr(b.status)); content = (await b.json()).content; }
  return {sha:j.sha, data:content ? JSON.parse(b64dec(content)) : null};
}
async function ghPut(data, sha){
  const body = {message:'Update tracker data', content:b64enc(JSON.stringify(data))}; if (sha) body.sha = sha;
  const r = await fetch(ghUrl(), {method:'PUT', headers:{...ghHeaders(), 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) return false; // the other device saved first: fetch and merge again
  if (!r.ok) throw new Error(ghErr(r.status));
  return true;
}
const SYNC = {state:'off', msg:'', at:null};
let syncing = false, syncAgain = false, syncTimer = null, pendingRender = false;
function syncText(){
  if (!ghReady()) return 'Not connected. Entries are saved on this device only.';
  if (SYNC.state === 'syncing') return 'Syncing…';
  if (SYNC.state === 'error') return 'Last sync failed: ' + SYNC.msg;
  if (SYNC.at) return 'Synced at ' + SYNC.at.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) + '.';
  return 'Connected.';
}
function setSync(state, msg){
  SYNC.state = state; SYNC.msg = msg || ''; if (state === 'ok') SYNC.at = new Date();
  $('#syncBtn').className = 'sync ' + state;
  $('#syncLabel').textContent = {off:'Local only', syncing:'Syncing…', ok:'Synced', error:'Sync error'}[state];
  const m = $('#syncMsg'); if (m) m.textContent = syncText();
}
function queueSync(){ if (!ghReady()) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
async function sync(){
  if (!ghReady()) { setSync('off'); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('syncing');
  try {
    let saved = false;
    for (let i = 0; i < 3 && !saved; i++) {
      const remote = await ghGet();
      const before = JSON.stringify(normalize(D));
      const merged = remote.data ? mergeData(normalize(D), normalize(remote.data)) : normalize(D);
      const mergedStr = JSON.stringify(merged);
      if (mergedStr !== before) { D = merged; persist(); renderSoon(); }
      if (remote.data && JSON.stringify(normalize(remote.data)) === mergedStr) { saved = true; break; }
      saved = await ghPut(merged, remote.sha);
    }
    if (!saved) throw new Error('Another device kept saving at the same moment. Tap Sync now.');
    setSync('ok');
  } catch (e) { setSync('error', e.message || String(e)); }
  syncing = false;
  if (syncAgain) { syncAgain = false; sync(); }
}
function isEditing(){ const a = document.activeElement; return !!(a && a.closest && a.closest('#view') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)); }
function renderSoon(){ if (isEditing()) { pendingRender = true; return; } render(); }
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { if (!isEditing()) { pendingRender = false; render(); } }, 0); });

    const v = Math.round(num('stepsIn')); if (isNaN(v) || v < 0) return toast('Enter your step count.');
    const id = 'st_' + UI.date, r = findRec('steps', id);
    if (r) { r.steps = v; r.deleted = false; stamp(r); } else D.steps.push(stamp({id, date:UI.date, steps:v}));
    commit(); toast('Steps saved');
  },
  startW:b => { UI.wDraft = draftFromTemplate(b.dataset.t); render(); window.scrollTo(0, 0); },
  editW:b => { const w = findRec('workouts', b.dataset.id); if (!w) return; UI.wDraft = JSON.parse(JSON.stringify(w)); render(); window.scrollTo(0, 0); },
  wAddRow:() => { UI.wDraft.exercises.push({name:'Bicep curl', kg:+D.settings.dumbbell || 0, n:2, sets:3, reps:12}); render(); },
  wDelRow:b => { UI.wDraft.exercises.splice(+b.dataset.i, 1); render(); },
  wCancel:() => { UI.wDraft = null; render(); },
  wSave:() => {
    const w = UI.wDraft; w.minutes = +w.minutes;
    if (!(w.minutes > 0)) return toast('Enter how many minutes you trained.');
    w.exercises = w.exercises.map(x => ({name:x.name, kg:+x.kg || 0, n:+x.n || 0, sets:+x.sets || 0, reps:+x.reps || 0}));
    const p = sessionParts(w);
    const rec = {...w, name:TEMPLATES[w.template].name, kcal:p.base + p.work, deleted:false};
    if (w.id) { const i = D.workouts.findIndex(x => x.id === w.id); D.workouts[i] = stamp(rec); }
    else D.workouts.push(stamp({...rec, id:uid()}));
    UI.date = w.date; UI.wDraft = null; commit(); toast('Workout saved');
  },
  addAct:() => {
    const a = ACTS[+$('#actSel').value], minutes = num('actMin');
    if (!(minutes > 0)) return toast('Enter minutes.');
    const w = {id:uid(), type:'activity', template:'act', name:a[0], met:a[1], date:UI.date, minutes};
    w.kcal = sessionParts(w).base; D.workouts.push(stamp(w)); commit(); toast('Activity added');
  },
  saveBody:() => {
    const date = $('#bDate').value, w = num('bW'), waist = num('bWaist');
    if (!date || (isNaN(w) && isNaN(waist))) return toast('Enter your weight, waist or both.');
    const id = 'b_' + date, r = findRec('body', id) || (() => { const n = {id, date}; D.body.push(n); return n; })();
    if (!isNaN(w)) r.weight = w; if (!isNaN(waist)) r.waist = waist; r.deleted = false; stamp(r);
    commit(); toast('Check-in saved');
  },
  xlsx:() => exportXlsx(),
  jsonOut:() => downloadJSON(),
  saveSettings:() => {
    const s = {...D.settings};
    Object.keys(DEFAULTS).forEach(k => {
      if (k === 'updatedAt') return; const el = $('#s_' + k); if (!el) return;
      if (k === 'startDate') { if (el.value) s[k] = el.value; } else if (el.value !== '' && !isNaN(+el.value)) s[k] = +el.value;
    });
    D.settings = stamp(s); commit(); toast('Targets saved');
  },
  saveGh:() => {
    const t = ($('#gToken').value || '').trim();
    GHCFG = {owner:$('#gOwner').value.trim(), repo:$('#gRepo').value.trim(), path:$('#gPath').value.trim() || 'data.json', token:t || GHCFG.token};
    saveJSON('ct_gh', GHCFG); render(); sync();
  },
  ghOff:() => { GHCFG.token = ''; saveJSON('ct_gh', GHCFG); setSync('off'); render(); toast('Disconnected. Entries stay on this device.'); },
  sync:() => { if (!ghReady()) { UI.tab = 'settings'; render(); return; } sync(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-action]'); if (b && ACTIONS[b.dataset.action]) ACTIONS[b.dataset.action](b, e); });

/* ================= Field bindings ================= */
function draftRow(t){ return UI.wDraft.exercises[+t.dataset.i]; }
function recipeItem(t){ return UI.recipeDraft.items[+t.dataset.i]; }
const BIND = {
  date:t => { if (t.value) { UI.date = t.value; render(); } },
  q:t => { UI.q = t.value; fillFoodList(); fillUnits(); itemPreview(); },
  food:t => { UI.food = t.value; UI.unit = ''; fillUnits(); itemPreview(); },
  qty:t => { UI.qty = t.value; itemPreview(); },
  unit:t => { UI.unit = t.value; itemPreview(); },
  meal:t => { UI.meal = t.value; },
  dish:t => { UI.dish = t.value; render(); },
  dishQty:t => { UI.dishQty = t.value; dishPreview(); },
  rName:t => { UI.recipeDraft.name = t.value; },
  rServings:t => { UI.recipeDraft.servings = t.value; updateRTotals(); },
  rServing:t => { UI.recipeDraft.serving = t.value; updateRTotals(); },
  rFood:t => { const it = recipeItem(t), f = foodById(t.value); it.food = t.value; if (f && !unitsFor(f).includes(it.unit)) it.unit = defaultUnit(f); render(); },
  rQty:t => { recipeItem(t).qty = t.value; updateRTotals(); },
  rUnit:t => { recipeItem(t).unit = t.value; updateRTotals(); },
  wDate:t => { if (t.value) { UI.wDraft.date = t.value; updateWTotals(); } },
  wMin:t => { UI.wDraft.minutes = t.value; updateWTotals(); },
  wEffort:t => { UI.wDraft.effort = t.value; updateWTotals(); },
  xName:t => { const r = draftRow(t), e = EX[t.value] || {}; r.name = t.value; r.n = e.n || 0; r.kg = r.n ? (+r.kg || +D.settings.dumbbell || 0) : 0; render(); },
  xKg:t => { draftRow(t).kg = t.value; updateWTotals(); },
  xN:t => { draftRow(t).n = +t.value; updateWTotals(); },
  xSets:t => { draftRow(t).sets = t.value; updateWTotals(); },
  xReps:t => { draftRow(t).reps = t.value; updateWTotals(); },
  jsonIn:t => {
    const file = t.files && t.files[0]; if (!file) return;
    const fr = new FileReader();
    fr.onload = () => { try { D = mergeData(normalize(D), normalize(JSON.parse(fr.result))); commit(); toast('Backup restored'); } catch (e) { toast('That file isn’t a Cut Tracker backup.'); } };
    fr.readAsText(file);
  }
};
function onField(e, type){
  const t = e.target, k = t.dataset && t.dataset.bind; if (!k || !BIND[k]) return;
  const changeOnly = t.tagName === 'SELECT' || t.type === 'date' || t.type === 'file';
  if (changeOnly !== (type === 'change')) return;
  BIND[k](t);
}
document.addEventListener('input', e => onField(e, 'input'));
document.addEventListener('change', e => onField(e, 'change'));

/* ================= Start ================= */
render();
setSync(ghReady() ? 'ok' : 'off');
sync();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
setInterval(() => { if (document.visibilityState === 'visible' && !isEditing()) sync(); }, 60000);
</script>
</body>
</html>
